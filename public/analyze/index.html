<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyze any company by ticker — Financial Rat</title>
  <meta name="description" content="Type a ticker and get a clear, objective analysis: business model, revenue sources, 10 years of financial statements, ratios, valuation, an adjustable DCF and price history since IPO.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <!-- adsense -->
  <meta name="google-adsense-account" content="ca-pub-5021141099891568">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5021141099891568" crossorigin="anonymous"></script>
  <!-- /adsense -->
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="search-hero" id="search-hero">
    <div class="container">
      <span class="eyebrow">Section 3 · Company analysis</span>
      <h1 id="search-title">Which company do you want to understand?</h1>
      <p class="muted" id="search-sub">Type a ticker symbol (like AAPL for Apple, 7203.T for Toyota) or a company name — companies from around the world are included.</p>
      <div class="search-box">
        <form id="search-form" role="search" autocomplete="off">
          <input type="search" id="q" placeholder="Ticker or company name" aria-label="Ticker or company name"
                 aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" spellcheck="false">
          <button class="btn btn-primary" type="submit">Analyze</button>
        </form>
        <ul class="suggest hidden" id="suggest" role="listbox"></ul>
      </div>
      <div class="quick-picks" id="quick-picks"></div>
    </div>
  </section>
  <div class="container" id="result" aria-live="polite"></div>
  <div class="container"><div class="ad-slot" data-slot="bottom"></div></div>
</main>
<div id="site-footer"></div>
<script src="/vendor/chart.umd.min.js"></script>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="/js/site.js"></script>
<script type="module" src="/js/analyze.js"></script>
</body>
</html>
