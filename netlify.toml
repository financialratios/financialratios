# Netlify settings: the website lives in /public, the data API in netlify/functions.
[build]
  publish = "public"
  command = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The paid plans were removed: send old links to the company analyzer.
[[redirects]]
  from = "/premium.html"
  to = "/analyze/"
  status = 301
